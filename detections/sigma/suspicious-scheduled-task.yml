title: Suspicious Scheduled Task Creation
id: 9e4b7c21-3a65-4d82-bf19-6c5e2a8d7134
status: experimental
description: |
  Detects creation of scheduled tasks, which can be abused to establish
  persistence on Windows systems.
  This detection hypothesis is derived from documented FIN7 activity.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: ikkipnx
date: 2026/09/29
tags:
  - attack.persistence
  - attack.t1053.005

logsource:
  category: process_creation
  product: windows

detection:
  selection:
    CommandLine|contains:
      - 'schtasks'
      - 'schtasks.exe'
      - '/create'
  condition: selection

falsepositives:
  - Legitimate software installation
  - System administration
  - Enterprise software deployment

level: medium
